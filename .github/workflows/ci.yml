name: CI

on:
  push:
    branches: [main, master, develop, "story/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff check
        run: |
          python -m pip install --upgrade pip ruff
          ruff check .

  test-sqlite:
    name: Test (SQLite) — Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # 5.0 = piso declarado (Django>=5.0); 5.2 = LTS vigente; 6.0 = actual.
        django-version: ["5.0", "5.2", "6.0"]
        exclude:
          # Django 6.0 requiere Python >= 3.12
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.0"
          # Django 5.0 soporta hasta Python 3.12
          - python-version: "3.13"
            django-version: "5.0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # En .venv para que pyright (venvPath="." / venv=".venv" en
        # pyproject) resuelva imports igual que en desarrollo local.
        # UNA sola invocación de pip con el pin de Django presente: en
        # invocaciones separadas el resolver puede "upgradear" Django
        # silenciosamente (p.ej. DRF 3.18 arrastraba Django 6.1 a los jobs
        # "5.0"). DRF >= 3.16 requiere Django >= 5.1 → constraint en 5.0.
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          if [ "${{ matrix.django-version }}" = "5.0" ]; then
            .venv/bin/pip install -e ".[dev]" "Django~=5.0.0" "djangorestframework<3.16"
          else
            .venv/bin/pip install -e ".[dev]" "Django~=${{ matrix.django-version }}.0" djangorestframework
          fi

      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -v

      - name: Type check with pyright
        run: |
          .venv/bin/pip install pyright
          .venv/bin/pyright

  test-postgres:
    name: Test (PostgreSQL) — Python 3.13 / Django 6.0
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sinpapel_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "Django~=6.0.0" psycopg2-binary djangorestframework

      - name: Run tests with PostgreSQL
        env:
          TEST_DB_ENGINE: django.db.backends.postgresql
          TEST_DB_NAME: sinpapel_test
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
        run: python -m pytest tests/ -v
