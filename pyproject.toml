[project]
name = "sinpapel"
version = "0.8.4"
description = "Versioned workflows, immutable audit, and pluggable e-signatures for Django."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Julio Adrián", email = "jadrian.s@gmail.com" },
]
keywords = [
    "django",
    "workflow",
    "state-machine",
    "audit-trail",
    "electronic-signature",
    "compliance",
    "paperless",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Groupware",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=5.0",
    "django-simple-history>=3.5",
    "cryptography>=42.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-django>=4.12",
    "pytest-cov>=5.0",
    "django-types>=0.19",
    "build>=1.2",
    "twine>=5.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage  = "https://github.com/aprendomx/sinpapel"
Source    = "https://github.com/aprendomx/sinpapel"
Issues    = "https://github.com/aprendomx/sinpapel/issues"
Changelog = "https://github.com/aprendomx/sinpapel/blob/main/docs/development/changelog.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Layout: flat — pyproject.toml + package files at repo root.
# package_dir maps the package "sinpapel" to the current working directory (.).
# Subpackages are declared explicitly (deterministic + visible).
[tool.setuptools]
packages = [
    "sinpapel",
    "sinpapel.management",
    "sinpapel.management.commands",
    "sinpapel.migrations",
    "sinpapel.models",
    "sinpapel.schemas",
    "sinpapel.services",
    "sinpapel.signing",
    "sinpapel.signing.backends",
]

[tool.setuptools.package-dir]
sinpapel = "."
"sinpapel.management" = "management"
"sinpapel.management.commands" = "management/commands"
"sinpapel.migrations" = "migrations"
"sinpapel.models" = "models"
"sinpapel.schemas" = "schemas"
"sinpapel.services" = "services"
"sinpapel.signing" = "signing"
"sinpapel.signing.backends" = "signing/backends"

[tool.setuptools.package-data]
sinpapel = ["py.typed"]
"sinpapel.migrations" = ["*.py"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["migrations", "docs", "site", ".venv"]

[tool.ruff.lint]
# Gate alcanzable hoy: errores pycodestyle, pyflakes e imports ordenados.
# Ampliar el set (UP/RUF/SIM/…) es trabajo post-1.0 con reformat dedicado.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["."]
exclude = [
    "tests",
    "docs",
    "site",
    ".venv",
    "__pycache__",
    ".pytest_cache",
]
pythonVersion = "3.10"
pythonPlatform = "Linux"
extraPaths = ["."]
venvPath = "."
venv = ".venv"
reportMissingImports = "warning"
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
reportAssignmentType = "warning"
reportReturnType = "warning"
reportIncompatibleMethodOverride = "warning"
reportIncompatibleVariableOverride = "warning"
reportInvalidTypeVarUse = "warning"
reportCallIssue = "warning"
